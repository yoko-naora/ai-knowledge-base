<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · AI知識庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1814;--ink-muted:#5a5650;--paper:#faf9f6;--gold:#b8925a;--border:rgba(26,24,20,.1);--serif:'Noto Serif JP',serif;--sans:'Noto Sans JP',sans-serif}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.8;min-height:100vh;display:flex;flex-direction:column}
nav{padding:18px 60px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(250,249,246,.94)}
.nav-logo{font-family:var(--serif);font-size:15px;letter-spacing:.12em;color:var(--ink);text-decoration:none}
.page-404{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.card{max-width:480px;width:100%;text-align:center;background:#fff;border:1px solid var(--border);border-radius:2px;padding:60px 48px}
.code{font-family:var(--serif);font-size:72px;font-weight:300;color:var(--gold);line-height:1;margin-bottom:16px}
h1{font-family:var(--serif);font-size:20px;font-weight:300;margin-bottom:12px}
p{font-size:13px;color:var(--ink-muted);line-height:2.1;margin-bottom:28px}
a{display:inline-block;padding:12px 28px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:500;letter-spacing:.08em;text-decoration:none;border-radius:2px;transition:.2s}
a:hover{background:#333;transform:translateY(-1px)}
footer{padding:24px 60px;text-align:center;font-size:11px;color:var(--ink-muted);border-top:1px solid var(--border)}
@media(max-width:600px){nav{padding:16px 24px}.card{padding:40px 24px}.code{font-size:56px}}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="insights.html">AI 知識庫</a>
</nav>

<div class="page-404">
  <div class="card">
    <div class="code">404</div>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは存在しないか、移動された可能性があります。<br>URLをお確かめの上、再度お試しください。</p>
    <a href="insights.html">トップに戻る →</a>
  </div>
</div>

<footer>
  © 2026 AI知識庫 · SNS Aladdin
</footer>
<script src="assets/js/main.js?v=6"></script>
</body>
</html>
