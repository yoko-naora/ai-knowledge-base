<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户管理 · 用AI看图作图</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1814; --ink-muted: #5a5650; --ink-faint: #9a9490;
  --paper: #faf9f6; --gold: #b8925a; --border: rgba(26,24,20,.1);
  --green: #2e7d32; --green-bg: #e8f5e9;
  --orange: #e65100; --orange-bg: #fff3e0;
  --red: #c44d34; --red-bg: #fdf0ec;
  --serif: 'Noto Serif JP', serif; --sans: 'Noto Sans JP', sans-serif;
}
body { background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
.container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
h1 { font-family: var(--serif); font-size: 24px; font-weight: 400; margin-bottom: 8px; }
.sub { font-size: 12px; color: var(--ink-faint); margin-bottom: 32px; }

/* Login */
.login-box { max-width: 400px; margin: 80px auto; text-align: center; }
.login-box h2 { font-family: var(--serif); font-size: 20px; margin-bottom: 24px; }
.login-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 2px; font-family: inherit; font-size: 14px; outline: none; margin-bottom: 12px; }
.login-box input:focus { border-color: var(--gold); }
.login-box button { width: 100%; padding: 12px; background: var(--ink); color: var(--paper); border: none; border-radius: 2px; font-family: inherit; font-size: 13px; cursor: pointer; font-weight: 500; }
.login-error { font-size: 11px; color: var(--red); margin-top: 8px; display: none; }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--border); font-weight: 500; font-size: 10px; letter-spacing: .08em; color: var(--ink-faint); text-transform: uppercase; background: #fff; }
tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:hover { background: rgba(184,146,90,.04); }
.name-cell { font-weight: 500; }
.email-cell { color: var(--ink-muted); font-size: 12px; }
.badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 10px; border-radius: 10px; }
.badge.active { background: var(--green-bg); color: var(--green); }
.badge.trialing { background: var(--orange-bg); color: var(--orange); }
.badge.ended { background: var(--red-bg); color: var(--red); }
.badge.none { background: #f0f0f0; color: var(--ink-faint); }
.badge.monthly { background: #e8f2f7; color: #2c5f7a; }
.badge.yearly { background: #fdf0ec; color: #c44d34; }
.date-cell { font-size: 11px; color: var(--ink-muted); white-space: nowrap; }

.stats { display: flex; gap: 24px; margin-bottom: 32px; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: 2px; padding: 20px 24px; min-width: 140px; }
.stat-card .num { font-family: var(--serif); font-size: 28px; font-weight: 400; }
.stat-card .label { font-size: 10px; color: var(--ink-faint); letter-spacing: .06em; margin-top: 4px; }

.loading { text-align: center; padding: 60px; color: var(--ink-faint); }
.error { text-align: center; padding: 40px; color: var(--red); }
.refresh { display: inline-block; margin-bottom: 20px; font-size: 11px; color: var(--gold); cursor: pointer; text-decoration: none; }
.refresh:hover { text-decoration: underline; }
.logout { float: right; font-size: 11px; color: var(--ink-faint); cursor: pointer; text-decoration: none; }
.logout:hover { color: var(--red); }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="login-box" id="loginBox">
    <h2>🔐 客户管理</h2>
    <input type="password" id="loginInput" placeholder="输入管理密码" autofocus>
    <button id="loginBtn">进入</button>
    <p class="login-error" id="loginError">密码错误</p>
  </div>
  <div id="dashboard" style="display:none;">
    <a class="logout" id="logoutBtn">退出</a>
    <h1>客户管理</h1>
    <p class="sub">数据来源：Stripe（实时）</p>
    <div class="stats" id="statsBar"></div>
    <a class="refresh" id="refreshBtn">刷新数据 ↻</a>
    <div class="loading" id="tableLoading">加载中...</div>
    <div class="error" id="tableError" style="display:none;"></div>
    <table id="customerTable" style="display:none;">
      <thead>
        <tr>
          <th>购买时间</th>
          <th>姓名</th>
          <th>邮箱</th>
          <th>产品</th>
          <th>方案</th>
          <th>状态</th>
          <th>小計</th>
          <th>税額</th>
          <th>实付</th>
          <th>到期日</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
(function() {
  // Security: admin key is validated server-side via /api/admin-customers?key=xxx
  // No hardcoded password or hash — key stored in sessionStorage only (cleared on tab close)

  var adminKey = sessionStorage.getItem('kb_admin_key');

  // ── Try to restore session ──
  if (adminKey) {
    verifyAndShow(adminKey);
  }

  // ── Login ──
  document.getElementById('loginBtn').addEventListener('click', function() {
    var pw = document.getElementById('loginInput').value.trim();
    if (!pw) return;
    verifyAndShow(pw);
  });

  document.getElementById('loginInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  function verifyAndShow(key) {
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginBtn').textContent = '验证中...';

    // Verify by calling the API — server checks the key
    fetch('/api/admin-customers?key=' + encodeURIComponent(key))
      .then(function(r) {
        if (r.status === 401) {
          // Invalid key — clear and show login
          sessionStorage.removeItem('kb_admin_key');
          adminKey = null;
          document.getElementById('loginError').style.display = '';
          document.getElementById('loginBtn').disabled = false;
          document.getElementById('loginBtn').textContent = '进入';
          return null;
        }
        if (!r.ok) throw new Error('Server error: ' + r.status);
        return r.json();
      })
      .then(function(data) {
        if (data === null) return; // Already handled 401 above
        // Success! Store key in sessionStorage
        sessionStorage.setItem('kb_admin_key', key);
        adminKey = key;
        showDashboard(data);
      })
      .catch(function(err) {
        document.getElementById('loginError').style.display = '';
        document.getElementById('loginError').textContent = err.message;
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').textContent = '进入';
      });
  }

  // ── Logout ──
  document.getElementById('logoutBtn').addEventListener('click', function() {
    sessionStorage.removeItem('kb_admin_key');
    adminKey = null;
    location.reload();
  });

  document.getElementById('refreshBtn').addEventListener('click', function() {
    loadData(adminKey);
  });

  function showDashboard(initialData) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = '';
    renderData(initialData);
  }

  // ── Load / refresh data ──
  function loadData(key) {
    if (!key) return;
    document.getElementById('tableLoading').style.display = '';
    document.getElementById('tableError').style.display = 'none';
    document.getElementById('customerTable').style.display = 'none';

    fetch('/api/admin-customers?key=' + encodeURIComponent(key))
      .then(function(r) {
        if (r.status === 401) {
          sessionStorage.removeItem('kb_admin_key');
          adminKey = null;
          location.reload();
          return null;
        }
        if (!r.ok) throw new Error('Server error: ' + r.status);
        return r.json();
      })
      .then(function(data) {
        if (data === null) return;
        document.getElementById('tableLoading').style.display = 'none';
        if (data.error) {
          document.getElementById('tableError').style.display = '';
          document.getElementById('tableError').textContent = data.error;
          return;
        }
        renderData(data);
      })
      .catch(function(err) {
        document.getElementById('tableLoading').style.display = 'none';
        document.getElementById('tableError').style.display = '';
        document.getElementById('tableError').textContent = '加载失败: ' + err.message;
      });
  }

  function renderData(data) {
    // Stats
    var active = data.customers.filter(function(c) { return c.status === 'active' || c.status === 'trialing'; });
    var monthly = active.filter(function(c) { return c.plan === 'monthly'; });
    var yearly = active.filter(function(c) { return c.plan === 'yearly'; });
    document.getElementById('statsBar').innerHTML =
      '<div class="stat-card"><div class="num">' + data.total + '</div><div class="label">总客户</div></div>' +
      '<div class="stat-card"><div class="num">' + active.length + '</div><div class="label">活跃订阅</div></div>' +
      '<div class="stat-card"><div class="num">' + monthly.length + '</div><div class="label">月额</div></div>' +
      '<div class="stat-card"><div class="num">' + yearly.length + '</div><div class="label">年额</div></div>';

    // Table
    var rows = '';
    data.customers.forEach(function(c) {
      var statusBadge = '';
      if (c.status === 'active') statusBadge = '<span class="badge active">活跃</span>';
      else if (c.status === 'trialing') statusBadge = '<span class="badge trialing">试用</span>';
      else if (c.status === 'ended') statusBadge = '<span class="badge ended">已到期</span>';
      else statusBadge = '<span class="badge none">无订阅</span>';

      var planBadge = '';
      if (c.plan === 'monthly') planBadge = '<span class="badge monthly">月额</span>';
      else if (c.plan === 'yearly') planBadge = '<span class="badge yearly">年额</span>';
      else planBadge = '<span>-</span>';

      rows += '<tr>' +
        '<td class="date-cell">' + formatTime(c.purchased_at) + '</td>' +
        '<td class="name-cell">' + escapeHtml(c.name || '-') + '</td>' +
        '<td class="email-cell">' + escapeHtml(c.email || '-') + '</td>' +
        '<td>' + escapeHtml(c.product || '-') + '</td>' +
        '<td>' + planBadge + '</td>' +
        '<td>' + statusBadge + '</td>' +
        '<td>' + formatAmount(c.subtotal) + '</td>' +
        '<td>' + formatTax(c.tax) + '</td>' +
        '<td>' + formatAmount(c.actual_paid) + '</td>' +
        '<td class="date-cell">' + formatTime(c.current_period_end) + '</td>' +
        '</tr>';
    });

    document.getElementById('tableBody').innerHTML = rows;
    document.getElementById('customerTable').style.display = '';
  }

  function formatTime(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr.slice(0, 10);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function formatAmount(amount) {
    if (amount == null || amount === undefined) return '-';
    return '¥' + amount.toLocaleString();
  }

  function formatTax(amount) {
    if (amount == null || amount === undefined) return '-';
    if (amount === 0) return '¥0';
    return '¥' + amount.toLocaleString();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
<script src="assets/js/main.js?v=6"></script>
</body>
</html>
