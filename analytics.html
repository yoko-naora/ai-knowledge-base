<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访问统计 · kb.snsaladdin.com</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 28px; }

  .big-num {
    font-size: 72px; font-weight: 800;
    background: linear-gradient(135deg, #FF6B35, #FF8F5E);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 4px;
  }
  .big-label { font-size: 13px; color: rgba(255,255,255,0.4); }

  .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 28px; }
  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px; padding: 18px;
  }
  .card h3 { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: .06em; margin-bottom: 14px; text-transform: uppercase; }

  .page-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
  .page-row .pv { color: #FF8F5E; font-weight: 600; }

  .timeline { font-size: 12px; color: rgba(255,255,255,0.5); }
  .timeline div { padding: 3px 0; display: flex; gap: 12px; }
  .timeline .tl-page { color: rgba(255,255,255,0.7); flex: 1; }
  .timeline .tl-time { color: rgba(255,255,255,0.25); font-variant-numeric: tabular-nums; }

  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-size: 11px; color: rgba(255,255,255,0.3); }

  .cf-link {
    display: inline-block; margin-top: 24px;
    padding: 10px 20px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
    color: rgba(255,255,255,0.6); font-size: 12px; text-decoration: none;
    transition: all 0.2s;
  }
  .cf-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .empty { color: rgba(255,255,255,0.2); font-size: 13px; padding: 20px 0; text-align: center; }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .big-num { font-size: 56px; }
  }
</style>
</head>
<body>

<h1>📊 访问统计</h1>
<p class="sub">kb.snsaladdin.com · 10s 自动刷新</p>

<div class="status">
  <div class="dot"></div>
  <span class="status-text" id="statusText">监测中…</span>
</div>

<div class="big-num" id="totalNum">—</div>
<div class="big-label">页面浏览量</div>

<div class="grid">
  <div class="card">
    <h3>热门页面</h3>
    <div id="topPages"><div class="empty">等待访问…</div></div>
  </div>
  <div class="card">
    <h3>最近访问</h3>
    <div class="timeline" id="recent"><div class="empty">等待访问…</div></div>
  </div>
</div>

<a class="cf-link" href="https://dash.cloudflare.com/09d66bf0a38b35962a68e1bce6a3db6a/analytics/web" target="_blank">📈 Cloudflare Web Analytics 详细数据 →</a>

<script>
function fmtTime(ts) {
  var d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0') + ':' +
         d.getSeconds().toString().padStart(2,'0');
}

function refresh() {
  fetch('/api/pageview?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('totalNum').textContent = data.total || 0;

      var pagesHtml = '';
      if (data.pages && data.pages.length > 0) {
        data.pages.forEach(function(p) {
          pagesHtml += '<div class="page-row"><span>' + p.page + '</span><span class="pv">' + p.views + '</span></div>';
        });
      } else {
        pagesHtml = '<div class="empty">等待访问…</div>';
      }
      document.getElementById('topPages').innerHTML = pagesHtml;

      var recentHtml = '';
      if (data.recent && data.recent.length > 0) {
        data.recent.forEach(function(r) {
          recentHtml += '<div><span class="tl-page">' + r.page + '</span><span class="tl-time">' + fmtTime(r.time) + '</span></div>';
        });
      } else {
        recentHtml = '<div class="empty">等待访问…</div>';
      }
      document.getElementById('recent').innerHTML = recentHtml;

      document.getElementById('statusText').textContent = '已更新 ' + fmtTime(data.updated || Date.now());
    })
    .catch(function() {
      document.getElementById('statusText').textContent = '连接中…';
    });
}

refresh();
setInterval(refresh, 10000);
</script>
<script src="assets/js/main.js?v=6"></script>
</body>
</html>
