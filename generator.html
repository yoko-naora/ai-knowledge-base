<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大神工具 · 功能原型</title>
  <style>
    /* 仅用于区分区块的最简样式，严禁添加设计意图 */
    body { font-family: sans-serif; margin: 40px; background: #f5f5f5; }
    .step { display: none; border: 2px solid #ccc; padding: 20px; margin-bottom: 20px; background: white; }
    .step.active { display: block; }
    .nav { margin-top: 20px; }
    button { padding: 8px 16px; margin-right: 8px; }
    .mock-box { border: 1px dashed #999; padding: 12px; margin: 10px 0; background: #fafafa; }
    .status { font-size: 12px; color: #666; margin-bottom: 10px; }
    pre { background: #eee; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>

<h1>大神工具 · 功能原型（裸逻辑版）</h1>
<p class="status">当前状态：<span id="current-status">input</span> | <button onclick="resetAll()">重置</button></p>

<!-- Step 1: 输入主题 -->
<div id="step-1" class="step active">
  <h2>Step 1 - 输入主题</h2>
  <div class="mock-box">
    <label>主题：<input type="text" id="topic-input" value="夏季口红推荐" style="width:300px"></label><br><br>
    <label>平台：
      <select id="platform-select">
        <option value="小红书">小红书</option>
        <option value="公众号">公众号</option>
      </select>
    </label>
  </div>
  <div class="nav">
    <button onclick="goToStep(2)">开始生成第一稿 →</button>
  </div>
</div>

<!-- Step 2: 第一稿 + 后台诊断 -->
<div id="step-2" class="step">
  <h2>Step 2 - 第一稿（后台已静默跑诊断）</h2>
  <div class="mock-box">
    <h4>标题</h4>
    <div id="draft1-title"></div>
    <h4>正文</h4>
    <div id="draft1-body"></div>
  </div>
  <div class="nav">
    <button onclick="goToStep(1)">← 返回修改主题</button>
    <button onclick="goToStep(3)">进入加料面板 →</button>
  </div>
</div>

<!-- Step 3: 加料面板 -->
<div id="step-3" class="step">
  <h2>Step 3 - 智能加料面板</h2>
  <div class="mock-box">
    <p><strong>根据诊断推荐：</strong></p>
    <label><input type="checkbox" id="addon-case"> 加客诉/真实案例</label><br>
    <label><input type="checkbox" id="addon-compare"> 加产品对比/数据</label><br>
    <label><input type="checkbox" id="addon-tips"> 加选购技巧/Tips</label><br>
    <label><input type="checkbox" id="addon-custom"> 自己写一段...</label>
    <textarea id="custom-text" placeholder="在这里输入自定义内容" style="width:100%; height:80px; margin-top:8px;"></textarea>
  </div>
  <div class="nav">
    <button onclick="goToStep(2)">← 返回第一稿</button>
    <button onclick="generateDraft2()">生成第二稿 →</button>
  </div>
</div>

<!-- Step 4/5: 第二稿 -->
<div id="step-5" class="step">
  <h2>Step 5 - 第二稿（修改部分已标蓝）</h2>
  <div class="mock-box">
    <h4>标题</h4>
    <div id="draft2-title"></div>
    <h4>正文</h4>
    <div id="draft2-body"></div>
  </div>
  <div class="nav">
    <button onclick="goToStep(3)">← 返回加料</button>
    <button onclick="goToStep(6)">确认进入质检 →</button>
  </div>
</div>

<!-- Step 6: 五维诊断报告 -->
<div id="step-6" class="step">
  <h2>Step 6 - 五维诊断报告</h2>
  <div class="mock-box" id="diagnosis-report"></div>
  <div class="nav">
    <button onclick="goToStep(5)">← 返回第二稿</button>
    <button onclick="quickFix()">60分跳过</button>
    <button onclick="fixAll()">全部修复</button>
    <button onclick="goToStep(7)">进入配图 →</button>
  </div>
</div>

<!-- Step 7: 配图 -->
<div id="step-7" class="step">
  <h2>Step 7 - 配图推荐</h2>
  <div class="mock-box">
    <p>系统推荐分类：<strong id="rec-categories"></strong></p>
    <button onclick="generateImage()">生成图片（免费1次）</button>
    <button onclick="handleNotSatisfied()">不满意</button>
    <div id="image-result" style="margin-top:15px;"></div>
  </div>
  <div class="nav">
    <button onclick="goToStep(6)">← 返回质检</button>
    <button onclick="goToStep(8)">进入封面制作 →</button>
  </div>
</div>

<!-- Step 8: 封面 -->
<div id="step-8" class="step">
  <h2>Step 8 - 封面制作</h2>
  <div class="mock-box">
    <p>小红书封面 + 视频号封面（待接入真实生成）</p>
    <div id="cover-result"></div>
  </div>
  <div class="nav">
    <button onclick="goToStep(7)">← 返回配图</button>
    <button onclick="finish()">完成 →</button>
  </div>
</div>

<!-- 完成状态 -->
<div id="step-done" class="step">
  <h2>已完成</h2>
  <p>终稿已生成，可在 localStorage 中查看完整数据。</p>
  <button onclick="resetAll()">重新开始</button>
</div>

<script>
// ====================== 状态机核心 ======================
let state = {
  currentStep: 'input',
  topic: '',
  platform: '',
  draft1: null,
  draft2: null,
  selectedAddons: [],
  userCustomText: '',
  diagnosis: null,
  imageSession: null,
  coverImages: null
};

function saveState() {
  localStorage.setItem('generator_state', JSON.stringify(state));
  document.getElementById('current-status').textContent = state.currentStep;
}

function loadState() {
  const saved = localStorage.getItem('generator_state');
  if (saved) {
    state = JSON.parse(saved);
    document.getElementById('current-status').textContent = state.currentStep;
  }
}

function showStep(stepNum) {
  document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(`step-${stepNum}`);
  if (target) target.classList.add('active');
  state.currentStep = stepNum === 'done' ? 'done' : `step-${stepNum}`;
  saveState();
}

// ====================== API ======================
const API_BASE = "";
function callApi(ep, data) {
  return fetch(API_BASE + "/api/" + ep, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || "err " + r.status); });
    return r.json();
  });
}

// ====================== Mock 数据 ======================
const MOCK = {
  draft1: {
    title: "夏季必备的3支口红，显白又显气质",
    body: "夏天到了，口红的选择变得更加重要。很多女生都希望找到一支既显白又不会显唇纹的颜色。今天我来推荐三支我自己用过最舒服的口红..."
  },
  draft2: {
    title: "夏季必备的3支口红，显白又显气质（含真实反馈）",
    body: "夏天到了，口红的选择变得更加重要。很多女生都希望找到一支既显白又不会显唇纹的颜色。今天我来推荐三支我自己用过最舒服的口红...<span style='color:blue'>【新增】一位读者反馈：第2支颜色在办公室灯光下特别显气质。</span>"
  },
  diagnosis: {
    textCleanliness: { grade: "✅", detail: "文字比较干净" },
    headlineDiagnosis: { grade: "⚠️", detail: "吸引力一般" },
    expressionEfficiency: { grade: "✅", detail: "核心观点清晰" },
    cognitiveGap: { grade: "❌", detail: "缺少真实案例" },
    aiSuggestions: "建议补充1-2个真实用户反馈"
  },
  recommendedCategories: ["电商/商业海报", "穿搭/形象/造型"]
};

// ====================== 流程函数 ======================
function goToStep(step) {
  if (step === 2) {
    state.topic = document.getElementById('topic-input').value;
    state.platform = document.getElementById('platform-select').value;
    document.getElementById('draft1-title').innerHTML = '生成中...';
    document.getElementById('draft1-body').innerHTML = '';
    callApi('writing-fragments', { topic: state.topic, platform: state.platform })
      .then(function(f) {
        state.angles = f.angles || [];
        return callApi('writing-shape', { topic: state.topic, platform: state.platform, angles: state.angles });
      })
      .then(function(a) {
        state.draft1 = { title: a.title, body: a.body };
        document.getElementById('draft1-title').innerHTML = a.title;
        document.getElementById('draft1-body').innerHTML = a.body;
        saveState();
      })
      .catch(function(e) {
        document.getElementById('draft1-title').innerHTML = '失败';
        document.getElementById('draft1-body').innerHTML = 'API: ' + e.message;
      });
  }
  
  if (step === 6) {
    document.getElementById('diagnosis-report').innerHTML = '诊断中...';
    var at = (state.draft2 || state.draft1 || {}).title || '';
    var ab = (state.draft2 ? state.draft2.body : '') || (state.draft1 ? state.draft1.body : '');
    callApi('dbs-content', { article: { title: at, body: ab } })
      .then(function(r) {
        state.diagnosis = r;
        var h = '';
        for (var k in r) {
          if (k === 'aiSuggestions') continue;
          h += '<p><strong>' + k + '</strong>: ' + (r[k].grade || '') + ' \u2014 ' + (r[k].detail || '') + '</p>';
        }
        h += '<p><strong>AI建议：</strong>' + r.aiSuggestions + '</p>';
        document.getElementById('diagnosis-report').innerHTML = h;
        saveState();
      })
      .catch(function(e) { document.getElementById('diagnosis-report').innerHTML = '诊断失败: ' + e.message; });
  }
  
  if (step === 7) {
    document.getElementById('rec-categories').textContent = '加载中...';
    state.imageSession = { hasUsedFreeQuota: false };
    callApi('recommend-prompts', { topic: state.topic || '' })
      .then(function(d) {
        var cs = d.recommended || [];
        document.getElementById('rec-categories').textContent = cs.length ? cs.map(function(c) { return c.cat; }).join(' + ') : '暂无推荐';
        state.recommendedPrompts = d;
        saveState();
      })
      .catch(function(e) { document.getElementById('rec-categories').textContent = '加载失败'; });
  }
  
  if (step === 8) {
    document.getElementById('cover-result').innerHTML = '生成中...';
    var at = (state.draft2 || state.draft1 || {}).title || '';
    var ab = (state.draft2 ? state.draft2.body : '') || (state.draft1 ? state.draft1.body : '');
    callApi('generate-cover', { article: { title: at, body: ab }, platform: state.platform === '视频号' ? 'video' : 'xiaohongshu' })
      .then(function(d) {
        if (d.coverHtml) {
          document.getElementById('cover-result').innerHTML = '<iframe srcdoc="' + d.coverHtml.replace(/"/g, '&quot;') + '" style="width:300px;height:400px;border:1px solid #ccc;border-radius:4px;"></iframe>';
        } else if (d.coverPrompt) {
          document.getElementById('cover-result').innerHTML = '<pre style="background:#f5f5f5;padding:10px;font-size:12px;max-height:200px;overflow:auto;">' + d.coverPrompt.replace(/</g, '&lt;') + '</pre>';
        } else {
          document.getElementById('cover-result').innerHTML = '失败';
        }
        saveState();
      })
      .catch(function(e) { document.getElementById('cover-result').innerHTML = '失败: ' + e.message; });
  }
  
  showStep(step);
}

}

function generateDraft2() {
  state.selectedAddons = [];
  if (document.getElementById('addon-case').checked) state.selectedAddons.push('case');
  if (document.getElementById('addon-compare').checked) state.selectedAddons.push('compare');
  if (document.getElementById('addon-tips').checked) state.selectedAddons.push('tips');
  if (document.getElementById('addon-custom').checked) {
    state.userCustomText = document.getElementById('custom-text').value;
  }
  document.getElementById('draft2-title').innerHTML = '生成中...';
  document.getElementById('draft2-body').innerHTML = '';
  callApi('writing-shape', {
    topic: state.topic,
    platform: state.platform,
    angles: state.angles || [],
    addons: state.selectedAddons,
    userCustomText: state.userCustomText || '',
  })
    .then(function(a) {
      state.draft2 = { title: a.title, body: a.body };
      document.getElementById('draft2-title').innerHTML = a.title;
      document.getElementById('draft2-body').innerHTML = a.body;
      saveState();
      showStep(5);
    })
    .catch(function(e) {
      document.getElementById('draft2-title').innerHTML = '失败';
      document.getElementById('draft2-body').innerHTML = 'API: ' + e.message;
    });
}

function quickFix() {
  goToStep(7);
}

function fixAll() {
  var r = MOCK.diagnosis;
  for (var k in r) {
    if (k === 'aiSuggestions') continue;
    r[k].grade = '✅';
    r[k].detail += '(已修复)';
  }
  var h = '';
  for (var k in r) {
    if (k === 'aiSuggestions') continue;
    h += '<p><strong>' + k + '</strong>: ' + r[k].grade + ' \u2014 ' + r[k].detail + '</p>';
  }
  h += '<p><strong>AI\u5efa\u8bae\uff1a</strong>' + r.aiSuggestions + '</p>';
  document.getElementById('diagnosis-report').innerHTML = h;
}

function finish() {
  showStep('done');
  alert('流程结束！\n标题: ' + ((state.draft2 || state.draft1 || {}).title || '') + '\n内容: ' + (((state.draft2 ? state.draft2.body.length : 0) || (state.draft1 ? state.draft1.body.length : 0)) + '字'));
}

function resetAll() {
  localStorage.removeItem('generator_state');
  location.reload();
}

// ====================== 初始化 ======================
function init() {
  loadState();
  
  // 如果有保存的状态，尝试恢复到对应步骤
  if (state.currentStep && state.currentStep !== 'input') {
    const stepNum = state.currentStep.replace('step-', '');
    if (document.getElementById(`step-${stepNum}`)) {
      showStep(stepNum);
    }
  }
  
  document.getElementById('current-status').textContent = state.currentStep || 'input';
}

init();
</script>

</body>
</html>
