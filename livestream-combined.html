    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* === Slide container === */
  #slideshow {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 4px 60px rgba(0,0,0,0.5);
  }

  /* === Overlay bar === */
  .overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 60px 40px 30px;
    pointer-events: none;
  }
  .overlay-inner {
    max-width: 900px;
    margin: 0 auto;
    pointer-events: auto;
  }
  .overlay-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
    background: rgba(255,107,53,0.2);
    color: #FF6B35;
    border: 1px solid rgba(255,107,53,0.3);
  }
  .overlay-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .overlay-sub {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .overlay-link {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 20px;
    background: #FF6B35;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
    pointer-events: auto;
  }
  .overlay-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(255,107,53,0.4);
  }
  .overlay-link:active {
    transform: translateY(0);
  }

  /* === Navigation === */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 20;
    backdrop-filter: blur(8px);
  }
  .nav-arrow:hover {
    background: rgba(255,255,255,0.16);
    color: #fff;
  }
  .nav-arrow.prev { left: 20px; }
  .nav-arrow.next { right: 20px; }

  /* === Progress === */
  .progress-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255,255,255,0.08);
    z-index: 30;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF6B35, #FF8F5E);
    width: 0%;
    transition: width 0.3s linear;
  }

  /* === Bottom controls === */
  .controls {
    position: absolute;
    bottom: 100px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 30;
    pointer-events: none;
  }
  .controls > * { pointer-events: auto; }

  .counter {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
  }

  .ctrl-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }
  .ctrl-btn:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
  .ctrl-btn.active {
    background: rgba(255,107,53,0.3);
    color: #FF6B35;
  }

  .jump-btn {
    width: auto;
    height: 36px;
    padding: 0 14px;
    border-radius: 18px;
    border: 1px solid rgba(255,107,53,0.4);
    background: rgba(255,107,53,0.15);
    color: #FF6B35;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .jump-btn:hover {
    background: rgba(255,107,53,0.3);
    color: #FF8F5E;
    border-color: rgba(255,143,94,0.6);
  }

  /* === Section divider === */
  .section-divider {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;

  .section-divider.active {
    opacity: 1;
    pointer-events: auto;
  }
  .section-divider h2 {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #FF6B35, #FF8F5E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .section-divider p {
    font-size: 18px;
    color: rgba(255,255,255,0.5);
  }
  .section-divider .count {
    margin-top: 20px;
    font-size: 14px;
    color: rgba(255,255,255,0.3);

    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.15);
    z-index: 30;
    text-align: center;
    pointer-events: none;

  #scriptPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

// ======================== STATE ========================
let current = 0;
let playing = true;
let timer = null;
const INTERVAL = 4000; // 4 seconds per slide
let total = SLIDE_DATA.length;

// ======================== RENDER ========================
function buildSlides() {
  const container = document.getElementById('slideshow');
  // Keep first child (progress-bar), last 3+1 (controls + hint)
  while (container.children.length > 7) {
    container.removeChild(container.children[7]);
  }

  SLIDE_DATA.forEach((slide, i) => {
    let el;
    if (slide.type === 'divider') {
      el = document.createElement('div');
      el.className = 'section-divider';
      el.innerHTML = `
        <h2>${slide.label}</h2>
        <p>${slide.sub}</p>
        <div class="count">${slide.count}</div>
      `;
    } else {
      el = document.createElement('div');
      el.className = 'slide';

      const img = document.createElement('img');
      img.src = slide.image;
      img.alt = slide.title || slide.text || '';
      img.loading = i < 5 ? 'eager' : 'lazy';
      el.appendChild(img);

      // Click on image to advance
      el.addEventListener('click', (e) => {
        if (!e.target.closest('a')) nextSlide();
      });
    }

    container.appendChild(el);
  });

  total = SLIDE_DATA.length;
}

// ======================== NAVIGATION ========================
function goTo(index) {
  const all = document.querySelectorAll('.slide, .section-divider');
  all.forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  current = index;
  updateCounter();
  resetProgress();
}

function nextSlide() {
  if (current < total - 1) {
    goTo(current + 1);
    resetTimer();
  }
}

function prevSlide() {
  if (current > 0) {
    goTo(current - 1);
    resetTimer();
  }
}

function resetSlide() {
  goTo(0);
  if (!playing) { playing = true; updatePlayBtn(); }
  resetTimer();
}

function jumpToPrompts() {
  const firstPrompt = SLIDE_DATA.findIndex(s => s.type === 'prompt');
  if (firstPrompt !== -1) {
    goTo(firstPrompt);
    resetTimer();
  }
}

// ======================== TIMER ========================
function resetTimer() {
  if (timer) { clearInterval(timer); timer = null; }
  if (playing) startTimer();
}

function startTimer() {
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    if (current < total - 1) {
      nextSlide();
    } else {
      // Loop back to start
      goTo(0);
    }
  }, INTERVAL);
}

function togglePlay() {
  playing = !playing;
  updatePlayBtn();
  if (playing) {
    startTimer();
  } else {
    if (timer) { clearInterval(timer); timer = null; }
  }
}

function updatePlayBtn() {
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  document.getElementById('playBtn').classList.toggle('active', playing);
}

// ======================== SCRIPT POPUP ========================
var scriptWindow = null;
function toggleScript() {
  if (scriptWindow && !scriptWindow.closed) {
    scriptWindow.close();
    scriptWindow = null;
    return;
  }
  scriptWindow = window.open(
    '/直播脚本-2小时.html',
    'livestream-script',
    'width=440,height=900,left=' + (screen.width - 460) + ',top=20,resizable=yes,scrollbars=yes'
  );
  if (scriptWindow) {
    scriptWindow.addEventListener('beforeunload', function() { scriptWindow = null; });
  }
}
// ======================== PROGRESS ========================
function resetProgress() {
  document.getElementById('progressFill').style.width = '0%';
}

// ======================== COUNTER ========================
function updateCounter() {
  document.getElementById('counter').textContent = `${current + 1} / ${total}`;
}

// ======================== KEYBOARD ========================
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { prevSlide(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { nextSlide(); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Space') { togglePlay(); e.preventDefault(); }
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
    e.preventDefault();
  }
});

// ======================== INIT ========================
buildSlides();
goTo(0);
startTimer();

// Preload next few images
function preloadAdjacent() {
  const toLoad = [];
  for (let i = current + 1; i <= Math.min(current + 3, total - 1); i++) {
    if (SLIDE_DATA[i] && SLIDE_DATA[i].image) toLoad.push(SLIDE_DATA[i].image);
  }
  toLoad.forEach(src => {
    const img = new Image();
    img.src = src;
  });
}
setInterval(preloadAdjacent, 2000);

console.log(`🎬 AI知识库 直播间幻灯片加载完成 — ${total} 张幻灯片`);
</script>
