<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词详情 · AI知识库</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
/* Detail page styles */
.detail-container { max-width: 900px; margin: 64px auto 0; padding: 40px 24px 80px; }
.detail-nav { margin-bottom: 24px; }
.detail-nav a { color: #FF6B35; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
.detail-nav a:hover { text-decoration: underline; }

.detail-header { margin-bottom: 32px; }
.detail-cat { display: inline-block; background: #f0f0f0; color: #666; font-size: 0.75rem; padding: 3px 12px; border-radius: 12px; margin-bottom: 12px; }
.detail-title { font-size: 1.6rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
.detail-meta { font-size: 0.82rem; color: #999; display: flex; gap: 16px; align-items: center; }

/* Media section */
.detail-media { margin-bottom: 40px; }
.detail-media img, .detail-media video { max-width: 100%; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); display: block; margin-bottom: 16px; }
.detail-media video { background: #000; }

/* Prompt section */
.prompt-block { margin-bottom: 32px; }
.prompt-label { font-size: 0.78rem; font-weight: 600; color: #FF6B35; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #FF6B35; padding-bottom: 4px; display: inline-block; }
.prompt-content {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 20px 24px;
  font-size: 0.9rem;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  color: #333;
  font-family: -apple-system, "Noto Sans SC", "Noto Sans JP", monospace, sans-serif;
}
.prompt-content.empty {
  border: 2px dashed #ddd;
  background: #fafafa;
  color: #bbb;
  text-align: center;
  padding: 40px;
  font-size: 0.9rem;
}
.prompt-content.empty em { font-style: italic; }

/* Copy button */
.copy-btn-wrap { text-align: right; margin-top: 10px; }
.copy-btn { display: inline-block; background: #fff; border: 1px solid #FF6B35; color: #FF6B35; padding: 4px 16px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; transition: .2s; }
.copy-btn:hover { background: #FF6B35; color: #fff; }
.copy-btn.copied { background: #4CAF50; border-color: #4CAF50; color: #fff; }

/* Text-only type */
.text-only-content {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 28px 32px;
  font-size: 0.95rem;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Author link at bottom */
/* Footer */
.detail-footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #eee; text-align: center; }
.detail-footer a { color: #FF6B35; text-decoration: none; font-weight: 500; }
.detail-footer a:hover { text-decoration: underline; }
.next-link { display: inline-block; background: #FF6B35; color: #fff !important; padding: 6px 18px; border-radius: 20px; font-size: 0.9rem; margin-left: 8px; }
.next-link:hover { background: #e55a2b; text-decoration: none !important; }

/* Loading & Error */
.detail-loading { text-align: center; padding: 80px 20px; color: #888; }
.detail-loading .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #FF6B35; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.detail-error { text-align: center; padding: 80px 20px; color: #999; }
.detail-error a { color: #FF6B35; }

/* Image grid for multiple images */
.image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 16px; }
.image-grid img { width: 100%; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); cursor: zoom-in; transition: .2s; }
.image-grid img:hover { transform: scale(1.02); }

/* Image container with max height */
.single-image { margin-bottom: 16px; }
.single-image img { max-height: 500px; width: auto; margin: 0 auto; border-radius: 12px; }

/* Video wrapper */
.video-wrapper { margin: 24px 0; position: relative; }
.video-wrapper video { width: 100%; border-radius: 12px; background: #000; }
.video-wrapper .video-placeholder {
  width: 100%; aspect-ratio: 16/9;
  background: #f0f0f0; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #ccc; font-size: 3rem;
}

/* Multiple images mixed */
.multi-image { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

/* Gating overlay */
.gated-wrap { position: relative; margin-top: 24px; }
.gated-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent 0%, rgba(250,249,246,.92) 45%, rgba(250,249,246,.98) 70%);
  padding: 100px 28px 40px; text-align: center; pointer-events: auto; z-index: 10;
}
.preview-blur { overflow: hidden; max-height: 320px; position: relative; opacity: 0.5; }

/* Floating prev/next arrows — only on prompts detail */
.floating-arrow {
  position: fixed; top: 50%; transform: translateY(-50%);
  padding: 8px 14px;
  background: rgba(26,24,20,0.78); color: #faf9f6;
  border-radius: 22px;
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; z-index: 999;
  text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: opacity .2s, background .2s; opacity: .55;
}
.floating-arrow:hover { opacity: 1; background: #1a1814; }
.floating-arrow-left  { left: 16px; }
.floating-arrow-right { right: 16px; }
.floating-arrow .arrow-icon { font-size: 1.1rem; }
@media (max-width: 768px) { .floating-arrow { display: none; } }
</style>
</head>
<body>

<nav>
  <div class="logo">AI<span>知识库</span></div>
  <ul class="nav-links">
    <li><a href="../index.html"><span class="lang-content cn">首页</span><span class="lang-content jp">TOPページ</span></a></li>
    <li><a href="../index.html#articles"><span class="lang-content cn">最新技术</span><span class="lang-content jp">最新技術</span></a></li>
    <li><a href="index.html"><span class="lang-content cn">最新提示词</span><span class="lang-content jp">最新プロンプト</span></a></li>
    <li><a href="../index.html#tools"><span class="lang-content cn">推荐工具</span><span class="lang-content jp">おすすめツール</span></a></li>

  </ul>
  <div class="lang-switch">
    <button class="active" onclick="switchLang('cn')">中文</button>
    <button onclick="switchLang('jp')">日本語</button>
  </div>
</nav>

<div class="detail-container" id="detailRoot">
  <div class="detail-loading" id="loading">
    <div class="spinner"></div>
    <div>加载中...</div>
  </div>
</div>

<footer>
  <div class="links">
    <a href="../index.html">文章列表</a>
    <a href="index.html">最新提示词</a>
    <a href="../index.html#tools">推荐工具</a>
    <a href="../index.html#pricing">定价</a>
    <a href="https://www.snsaladdin.com/">SNS Aladdin</a>
  </div>
  <div class="copyright">© 2026 AI知识库</div>
</footer>

<script src="../assets/js/main.js?v=6"></script>
<script>

// ── Utility functions ──
function getLang() { return localStorage.getItem('kb-lang') || 'cn'; }
function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr.slice(0, 10);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getParam(name) {
  var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var catMapJp = {
  '电商/商业海报': 'EC/商業ポスター', '穿搭/形象/造型': '着こなし/イメージ/スタイリング',
  '教育/科普/图解': '教育/科学/図解', '视频制作/Seedance': '動画制作/Seedance',
  '品牌/VI/包装': 'ブランド/VI/パッケージ', '游戏/娱乐/影视': 'ゲーム/エンタメ/映像',
  '全景/3D/空间': 'パノラマ/3D/空間', '健康/生活/实用工具': '健康/生活/実用ツール',
  '其他/教育': 'その他/教育', '其他/闲聊': 'その他/雑談'
};

function injectArrows(idx, total) {
  document.querySelectorAll('.floating-arrow').forEach(function(el) { el.remove(); });
  var lang = getLang();
  if (idx > 0) {
    var left = document.createElement('a');
    left.className = 'floating-arrow floating-arrow-left';
    left.href = '?id=' + (idx - 1);
    left.innerHTML = '<span class="arrow-icon">←</span><span>' + (lang === 'cn' ? '上一页' : '前のページ') + '</span>';
    document.body.appendChild(left);
  }
  if (idx < total - 1) {
    var right = document.createElement('a');
    right.className = 'floating-arrow floating-arrow-right';
    right.href = '?id=' + (idx + 1);
    right.innerHTML = '<span>' + (lang === 'cn' ? '下一页' : '次のページ') + '</span><span class="arrow-icon">→</span>';
    document.body.appendChild(right);
  }
}

// ── State ──
var cachedData = null;
var currentIdx = null;

// ── Render (called on load + language switch) ──
function renderPrompt() {
  var data = cachedData;
  var idx = currentIdx;
  var root = document.getElementById('detailRoot');
  var loading = document.getElementById('loading');
  if (!data || idx === null) return;

  var p = data[idx];
  var lang = getLang();
  var isCn = lang === 'cn';
  var isJp = !isCn;
  var copyBtnHtml = '<div class="copy-btn-wrap"><button class="copy-btn">' + (isCn ? '复制' : 'コピー') + '</button></div>';

  // ── Full content path (paywall removed 2026-06-09) ──
  var text = isCn ? (p.text || '') : (p.text_ja || p.text || '');
  var imagePrompt = isCn ? (p.image_prompt || '') : (p.image_prompt_ja || p.image_prompt || '');
  var videoPrompt = isCn ? (p.video_prompt || '') : (p.video_prompt_ja || p.video_prompt || '');
  var realPrompt = isCn ? (p.real_prompt || '') : (p.real_prompt_ja || p.real_prompt || '');

  var hasImages = p.images && p.images.length > 0;
  var hasVideo = p.video ? true : false;
  var hasTextOnly = !hasImages && !hasVideo;

  function imgPath(name) {
    if (name.startsWith('http')) return name;
    return 'images/' + name.replace(/^images\//, '');
  }
  function videoPath(name) {
    return 'videos/' + name.replace(/^videos\//, '');
  }

  var html = '';
  html += '<div class="detail-nav"><a href="index.html">← ' + (isCn ? '返回提示词列表' : 'プロンプト一覧に戻る') + '</a></div>';
  html += '<div class="detail-header">';
  html += '<div class="detail-cat">' + (isJp ? (catMapJp[p.cat] || p.cat) : (p.cat || '未分类')) + '</div>';
  html += '<h1 class="detail-title">' + escapeHtml(text.split('\n')[0].substring(0, 80)) + '</h1>';
  html += '<div class="detail-meta">';
  html += '<span>' + (p.author || '@MrLarus') + '</span>';
  html += '<span>' + formatDate(p.date || p.title || '') + '</span>';
  html += '</div></div>';

  if (hasTextOnly) {
    html += '<div class="text-only-content">' + escapeHtml(text) + '</div>';
    html += copyBtnHtml;
  } else if (hasVideo) {
    if (hasImages) {
      html += '<div class="detail-media"><div class="single-image" style="text-align:center;"><img src="' + imgPath(p.images[0]) + '" alt="" loading="lazy"></div></div>';
    }
    html += '<div class="video-wrapper"><video controls preload="metadata"><source src="' + videoPath(p.video) + '" type="video/mp4"></video></div>';
    if (imagePrompt) {
      html += '<div class="prompt-block"><div class="prompt-label">' + (isCn ? '📷 图片提示词' : '📷 画像プロンプト') + '</div><div class="prompt-content">';
      for (var vi = 1; vi < p.images.length; vi++) {
        html += '<img src="' + imgPath(p.images[vi]) + '" alt="" style="max-width:100%;border-radius:8px;margin:8px 0;" loading="lazy"><br>';
      }
      html += escapeHtml(imagePrompt) + '</div>' + copyBtnHtml + '</div>';
    }
    if (videoPrompt) {
      html += '<div class="prompt-block"><div class="prompt-label">' + (isCn ? '🎬 视频提示词' : '🎬 動画プロンプト') + '</div><div class="prompt-content">' + escapeHtml(videoPrompt) + '</div>' + copyBtnHtml + '</div>';
    }
    if (text) {
      html += '<div class="prompt-block"><div class="prompt-label">' + (isCn ? '📝 帖子文案' : '📝 投稿キャプション') + '</div><div class="prompt-content">' + escapeHtml(text) + '</div>' + copyBtnHtml + '</div>';
    }
  } else if (hasImages && !hasVideo) {
    html += '<div class="detail-media"><div class="single-image" style="text-align:center;"><img src="' + imgPath(p.images[0]) + '" alt="" loading="lazy"></div></div>';
    if (text) {
      html += '<div class="prompt-block"><div class="prompt-label">' + (isCn ? '📝 帖子文案' : '📝 投稿キャプション') + '</div><div class="prompt-content">' + escapeHtml(text) + '</div>' + copyBtnHtml + '</div>';
    }
    html += '<div class="prompt-block"><div class="prompt-label">' + (isCn ? '📋 完整提示词' : '📋 プロンプト全文') + '</div><div class="prompt-content">';
    for (var gi = 1; gi < p.images.length; gi++) {
      html += '<img src="' + imgPath(p.images[gi]) + '" alt="" style="max-width:100%;border-radius:8px;margin:8px 0;" loading="lazy"><br>';
    }
    if (realPrompt) {
      html += escapeHtml(realPrompt);
    } else {
      html += '<em>' + (isCn ? '提示词待补充' : 'プロンプト未補充') + '</em>';
    }
    html += '</div>' + copyBtnHtml + '</div>';
  }

  html += '<div class="detail-footer">';
  html += '<a href="' + escapeAttr(p.link || '#') + '" target="_blank" rel="noopener" style="margin-right:20px;">☝️ ' + (isCn ? '查看 X 原贴 →' : 'Xの元ポストを見る →') + '</a>';
  if (idx + 1 < data.length) {
    html += '<a href="?id=' + (idx + 1) + '" class="next-link">👉 ' + (isCn ? '去下一页' : '次のページ') + '</a>';
  }
  html += '</div>';

  loading.style.display = 'none';
  root.innerHTML = html;
  injectArrows(idx, data.length);
}

// ── Language change listener (main.js switchLang dispatches langchange) ──
document.addEventListener('langchange', function(e) {
  if (cachedData !== null) {
    renderPrompt();
  }
});

// ── Initial load ──
(function() {
  var root = document.getElementById('detailRoot');
  var loading = document.getElementById('loading');
  var id = getParam('id');
  if (id === null || id === '') {
    loading.innerHTML = '<div class="detail-error">缺少参数，<a href="index.html">返回提示词列表</a></div>';
    return;
  }

  fetch('data.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var idx = parseInt(id, 10);
      if (isNaN(idx) || idx < 0 || idx >= data.length) {
        loading.innerHTML = '<div class="detail-error">未找到该提示词，<a href="index.html">返回列表</a></div>';
        return;
      }
      cachedData = data;
      currentIdx = idx;
      renderPrompt();
    })
    .catch(function(err) {
      loading.innerHTML = '<div class="detail-error">加载失败，<a href="index.html">返回列表</a></div>';
      console.error('Detail load error:', err);
    });

  // Copy button handler (event delegation — survives re-render)
  root.addEventListener('click', function(e) {
    var btn = e.target.closest('.copy-btn');
    if (!btn) return;
    var block = btn.closest('.prompt-block');
    var content = block ? block.querySelector('.prompt-content') : document.querySelector('.text-only-content');
    if (!content) return;
    var text = content.innerText;
    var doCopy = function() {
      btn.classList.add('copied');
      var lang = getLang();
      btn.textContent = lang === 'cn' ? '✓ 已复制' : '✓ コピーしました';
      setTimeout(function() {
        btn.classList.remove('copied');
        btn.textContent = lang === 'cn' ? '复制' : 'コピー';
      }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(doCopy).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        doCopy();
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      doCopy();
    }
  });
})();
</script>
</body>
