<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词详情</title>
<style>
body{font-family:"Noto Sans JP","Noto Sans SC",sans-serif;margin:0;padding:0;background:#faf9f6;color:#1a1814}
main{max-width:800px;margin:0 auto;padding:40px 20px}
img,video{max-width:100%;border-radius:8px;margin:8px 0;display:block}
pre{background:#fff;border:1px solid #e0e0e0;padding:16px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow-x:auto}
h1{font-size:20px;margin:0 0 8px}
.cat{font-size:12px;color:#888;margin-bottom:16px}
.author{font-size:13px;color:#666;margin-bottom:24px}
.label{font-size:12px;font-weight:600;color:#b8925a;letter-spacing:1px;margin:24px 0 8px}
.back{display:inline-block;margin-bottom:24px;color:#b8925a;text-decoration:none;font-size:14px}
.back:hover{text-decoration:underline}
.error{text-align:center;padding:60px 20px;color:#888}
.spin{text-align:center;padding:60px 20px;color:#888}
/* Floating prev/next arrows */
.floating-arrow{position:fixed;top:50%;transform:translateY(-50%);padding:8px 14px;background:rgba(26,24,20,.78);color:#faf9f6;border-radius:22px;display:flex;align-items:center;gap:6px;font-size:.8rem;z-index:999;text-decoration:none;cursor:pointer;white-space:nowrap;transition:opacity .2s,background .2s;opacity:.55}
.floating-arrow:hover{opacity:1;background:#1a1814}
.floating-arrow-left{left:16px}
.floating-arrow-right{right:16px}
.floating-arrow .arrow-icon{font-size:1.1rem}
@media(max-width:768px){.floating-arrow{display:none}}
</style>
</head>
<body>
<main id="m">
  <div class="spin">加载中...</div>
</main>
<script>
var m = document.getElementById('m');
var raw = location.search.match(/[?&]id=([^&]*)/);
var id = raw ? raw[1] : null;
if (!id) { m.innerHTML = '<div class="error">缺少参数<br><br><a class="back" href="index.html">← 返回列表</a></div>'; }
var targetId = parseInt(id, 10);

(function tryCache() {
  try {
    var c = sessionStorage.getItem('kb-prompt-cache');
    if (c) { show(JSON.parse(c)); }
  } catch(e) {}
})();
fetch('/prompts/data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    try { sessionStorage.setItem('kb-prompt-cache', JSON.stringify(data)); } catch(e) {}
    show(data);
  })
  .catch(function() { /* cache already shown, swallow */ });

function show(data) {
  var p = data.find(function(item) { return item.id === targetId; });
  if (!p) { m.innerHTML = '<div class="error">未找到 #' + targetId + '<br><br><a class="back" href="index.html">← 返回列表</a></div>'; return; }
  var jp = (localStorage.getItem('kb-lang')||'cn')==='jp';
  var text = jp ? (p.text_ja||p.text||'') : (p.text||'');
  var imp = jp ? (p.image_prompt_ja||p.image_prompt||'') : (p.image_prompt||'');
  var vip = jp ? (p.video_prompt_ja||p.video_prompt||'') : (p.video_prompt||'');
  var rp  = jp ? (p.real_prompt_ja||p.real_prompt||'') : (p.real_prompt||'');

  var h = '<a class="back" href="index.html">← '+(jp?'一覧に戻る':'返回列表')+'</a>';
  h += '<h1>'+text.split('\n')[0].substring(0,100)+'</h1>';
  h += '<div class="cat">'+(p.cat||'')+'</div>';
  h += '<div class="author">'+(p.author||'')+' · '+(p.date||'')+'</div>';
  if (text) h += '<p style="line-height:1.8;color:#555;white-space:pre-wrap">'+text+'</p>';

  if (p.images&&p.images.length) {
    h += '<div class="label">'+(jp?'🖼 画像':'🖼 图片')+'</div>';
    p.images.forEach(function(im){ h += '<img src="images/'+im.replace(/^images\//,'')+'" loading="lazy">'; });
  }
  if (p.video) {
    h += '<div class="label">'+(jp?'🎬 動画':'🎬 视频')+'</div>';
    h += '<video controls preload="metadata"><source src="videos/'+p.video.replace(/^videos\//,'')+'" type="video/mp4"></video>';
  }

  function sec(label, content) {
    if (!content) return;
    h += '<div class="label">'+label+'</div><pre>'+content+'</pre>';
  }
  sec(jp?'📷 画像プロンプト':'📷 图片提示词', imp);
  sec(jp?'🎬 動画プロンプト':'🎬 视频提示词', vip);
  if (rp && rp!==imp && rp!==vip) sec(jp?'📝 実プロンプト':'📝 实际提示词', rp);

  m.innerHTML = h;

  // Add floating prev/next arrows
  injectArrows(data);
}

function injectArrows(data) {
  // Remove any existing arrows
  document.querySelectorAll('.floating-arrow').forEach(function(el){ el.remove(); });
  var idx = data.findIndex(function(item){ return item.id === targetId; });
  if (idx === -1) return;
  var jp = (localStorage.getItem('kb-lang')||'cn')==='jp';
  if (idx > 0) {
    var prev = data[idx - 1];
    var left = document.createElement('a');
    left.className = 'floating-arrow floating-arrow-left';
    left.href = 'detail.html?id=' + prev.id;
    left.innerHTML = '<span class="arrow-icon">←</span><span>' + (jp?'前のページ':'上一页') + '</span>';
    document.body.appendChild(left);
  }
  if (idx < data.length - 1) {
    var next = data[idx + 1];
    var right = document.createElement('a');
    right.className = 'floating-arrow floating-arrow-right';
    right.href = 'detail.html?id=' + next.id;
    right.innerHTML = '<span>' + (jp?'次のページ':'下一页') + '</span><span class="arrow-icon">→</span>';
    document.body.appendChild(right);
  }
}
</script>
</body>
</html>
